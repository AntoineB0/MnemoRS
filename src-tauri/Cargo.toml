[package]
name = "mnemors"
version = "0.1.0"
description = "Terminal avec harness IA"
authors = ["icetech"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "mnemors_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
anyhow = "1.0"
portable-pty = "0.9"
regex = "1.13"
blake3 = "1.8"
tokio = { version = "1", features = ["time"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "webpki-roots"] }
futures-util = "0.3"
keyring = "4.2"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
