[package]
name = "mnemors"
version = "0.1.0"
description = "Terminal avec harness IA"
authors = ["icetech"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "mnemors_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4" }

[dependencies]
anyhow = "1.0"
portable-pty = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tauri = { version = "2.12.5" }
tauri-plugin-log = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
